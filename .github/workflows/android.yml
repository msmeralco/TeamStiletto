# Builds an installable debug APK on GitHub's Linux runner. Download it from the run's Artifacts and install it on a phone
# (allow "install unknown apps"). A Play Store release needs a signed release build (assembleRelease + your keystore).
name: android-apk
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm ci
      - run: npm test
      - run: npx cap add android && npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: TANAW-debug-apk, path: android/app/build/outputs/apk/debug/app-debug.apk }
