# Builds an UNSIGNED TANAW.ipa on GitHub's macOS runner (no Mac needed). Download it from the run's Artifacts.
# Install on an iPhone by re-signing with your Apple ID (Sideloadly/AltStore), or add signing secrets later for TestFlight.
name: ios-ipa
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: macos-latest # macos-14 was rejected: "configuration 'macos-14-arm64-us-default' is not supported"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci
      - run: npm test
      - run: npx cap add ios && npx cap sync ios
      - run: |
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release -sdk iphoneos \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
          mkdir Payload && cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qr TANAW-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with: { name: TANAW-unsigned-ipa, path: TANAW-unsigned.ipa }
